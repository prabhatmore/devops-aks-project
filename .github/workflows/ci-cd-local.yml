name: Build and Deploy (local minikube via self-hosted runner + ArgoCD)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci-cd-local.yml'

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image inside minikube's docker daemon
        run: |
          minikube docker-env | grep '^export' | sed 's/export //; s/"//g' >> "$GITHUB_ENV"
          eval "$(minikube docker-env)"
          docker build --pull -t aks-lab-app:${{ github.sha }} ./app

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aks-lab-app:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Update image tag in git (ArgoCD will deploy it)
        run: |
          sed -i '' "s#image: aks-lab-app:.*#image: aks-lab-app:${{ github.sha }}#" argocd-manifests/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "ci: deploy aks-lab-app:${{ github.sha }}" || echo "no changes to commit"
          git push