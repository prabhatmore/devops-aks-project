name: Build and Deploy (local minikube via self-hosted runner + ArgoCD)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci-cd-local.yml'

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image inside minikube's docker daemon
        run: |
          eval "$(minikube docker-env)"
          docker build -t aks-lab-app:${{ github.sha }} ./app

      - name: Update image tag in git (ArgoCD will deploy it)
        run: |
          sed -i '' "s#image: aks-lab-app:.*#image: aks-lab-app:${{ github.sha }}#" argocd-manifests/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "ci: deploy aks-lab-app:${{ github.sha }}" || echo "no changes to commit"
          git push