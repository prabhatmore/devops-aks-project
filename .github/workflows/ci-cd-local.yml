name: Build and Deploy (local minikube via self-hosted runner)

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'k8s/**'
      - 'k8s-local/**'
      - '.github/workflows/ci-cd-local.yml'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image inside minikube's docker daemon
        run: |
          eval "$(minikube docker-env)"
          docker build -t aks-lab-app:${{ github.sha }} ./app
          docker tag aks-lab-app:${{ github.sha }} aks-lab-app:v1

      - name: Deploy to local cluster
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s-local/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout restart deployment/aks-lab-app -n akslab
          kubectl rollout status deployment/aks-lab-app -n akslab